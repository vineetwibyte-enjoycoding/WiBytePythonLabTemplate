# ==============================================================================
# NEW: UNIX HTTP Server & Supervisorctl configuration
# Required to prevent "no such file xmlrpc.py" errors when querying process status.
# ==============================================================================
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# 1. Virtual X11 Display Server (Creates the in-memory display buffer :1)
[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x16 -ac
autorestart=true
startsecs=0
startretries=10
priority=10

# 2. Lightweight Window Manager (Adds window borders, title bars, and focus)
[program:fluxbox]
command=fluxbox -display :1
environment=DISPLAY=":1"
autorestart=true
startsecs=0
startretries=10
priority=20

# 3. VNC Server (Captures the X11 screen buffer on port 5901)
[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared -rfbport 5901
autorestart=true
startsecs=0
startretries=10
priority=30

# 4. WebSockets Bridge (Exposes VNC to browser-friendly HTTP on port 6080)
# ==============================================================================
# UPDATED: WebSockets Bridge (noVNC)
# Changed to call python3 -m websockify explicitly so it uses the pip package.
# ==============================================================================
[program:novnc]
command=python3 -m websockify --web=/usr/share/novnc 6080 localhost:5901
autorestart=true
startsecs=0
startretries=10
priority=40