[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# 1. Virtual X11 Display Server (Screen resolution: 1280x800, 16-bit color)
[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x16 -ac
autorestart=true
priority=10

# 2. Lightweight Window Manager (Gives Tkinter windows title bars, borders, and focus)
[program:fluxbox]
command=fluxbox -display :1
environment=DISPLAY=":1"
autorestart=true
priority=20

# 3. VNC Server (Captures the X11 screen buffer)
[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared -rfbport 5901
autorestart=true
priority=30

# 4. WebSockets Bridge (Translates VNC traffic to browser-friendly HTTP on port 6080)
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5901
autorestart=true
priority=40
